<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chain RXN</title>



    <link rel="stylesheet"
          href="style.css">

<body>

    <!-- TOP BAR -->
     

    <header class="top-bar">

        <div class="left-title">
            CHAIN REACTION.
        </div>

        <div class="center-text"
             id="turnText">

            BLUE player starts

        </div>

        <div class="right-info">

            <span id="gameTimer">
                GAME TIMER 3:00
            </span>

            <span id="playerTimer">
                PLAYER TIMER 0:15
            </span>

            <span id="blueScore"> 
                 0
            </span>

            <span id="redScore">
                RED 0
            </span>
            <button id="pauseBtn">
                    PAUSE
            </button>

        </div>

    </header>


    <!-- GAME AREA -->

    <main class="game-container">

        <div class="board"
             id="board">

        </div>

    </main>


    <!-- EXPLOSION SOUND -->

    <audio id="explodeSound"
           src="sounds/explode.mp3"></audio>

    <script src="script.js"></script>

</body>

</html>
